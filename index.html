// TAB: CUMULATIVE
// ═══════════════════════════════════════════════════════
function TabCumul({ data }) {
  const { sessions, members } = data;

  // ─── 季度與年份篩選 ───
  const years = [...new Set(sessions.map(s => (s.date || "").slice(0, 4)).filter(Boolean))].sort().reverse();
  const currentYear = years[0] || String(new Date().getFullYear());
  const [filterYear, setFilterYear] = useState(currentYear);
  const [filterQ, setFilterQ] = useState("all"); // all / Q1 / Q2 / Q3 / Q4

  const Q_MONTHS = { Q1: [1, 2, 3], Q2: [4, 5, 6], Q3: [7, 8, 9], Q4: [10, 11, 12] };

  const inFilter = (s) => {
    const d = s.date || "";
    const y = d.slice(0, 4);
    const m = parseInt(d.slice(5, 7)) || 0;
    if (filterYear !== "all" && y !== filterYear) return false;
    if (filterQ !== "all" && !Q_MONTHS[filterQ].includes(m)) return false;
    return true;
  };

  const filteredSessions = sessions.filter(inFilter);

  const map = {};
  filteredSessions.forEach(s => s.players.forEach(p => {
    if (p.type === "dealer") return;
    const k = resolveId(p.name, members);
    if (!map[k]) map[k] = { id: k, name: dispName(p.name, members), count: 0, total: 0, best: -Infinity, worst: Infinity };
    map[k].count++; map[k].total += p.amount;
    if (p.amount > map[k].best) map[k].best = p.amount;
    if (p.amount < map[k].worst) map[k].worst = p.amount;
  }));
  // 用「成員名單目前的身份」分流：member → 排行榜，其他（guest/dealer/venue/查無）→ 來賓區
  const isCurrentMember = (id) => {
    const m = members.find(x => x.id === id);
    return m && m.type === "member";
  };
  const allRows = Object.values(map);
  const rows = allRows.filter(r => isCurrentMember(r.id)).sort((a, b) => b.total - a.total);
  const guestRows = allRows.filter(r => !isCurrentMember(r.id)).sort((a, b) => b.total - a.total);

  // ─── 每季冠軍（依目前選的年份，算出該年 4 季各自的冠軍）───
  const champYear = filterYear === "all" ? currentYear : filterYear;
  const quarterChamps = ["Q1", "Q2", "Q3", "Q4"].map(q => {
    const qSessions = sessions.filter(s => {
      const d = s.date || "";
      if (d.slice(0, 4) !== champYear) return false;
      const m = parseInt(d.slice(5, 7)) || 0;
      return Q_MONTHS[q].includes(m);
    });
    const qMap = {};
    qSessions.forEach(s => s.players.forEach(p => {
      if (p.type === "dealer") return;
      const k = resolveId(p.name, members);
      if (!isCurrentMember(k)) return; // 只算目前是「成員」的人
      if (!qMap[k]) qMap[k] = { name: dispName(p.name, members), total: 0 };
      qMap[k].total += p.amount;
    }));
    const sorted = Object.values(qMap).sort((a, b) => b.total - a.total);
    return { q, champ: sorted[0] || null, loser: sorted.length > 1 ? sorted[sorted.length - 1] : null, sessionCount: qSessions.length };
  });

  // 年度輸贏王（整年）
  const yearStat = (() => {
    const ySessions = sessions.filter(s => (s.date || "").slice(0, 4) === champYear);
    const yMap = {};
    ySessions.forEach(s => s.players.forEach(p => {
      if (p.type === "dealer") return;
      const k = resolveId(p.name, members);
      if (!isCurrentMember(k)) return;
      if (!yMap[k]) yMap[k] = { name: dispName(p.name, members), total: 0 };
      yMap[k].total += p.amount;
    }));
    const sorted = Object.values(yMap).sort((a, b) => b.total - a.total);
    return { champ: sorted[0] || null, loser: sorted.length > 1 ? sorted[sorted.length - 1] : null, sessionCount: ySessions.length };
  })();

  const Q_LABELS = { all: "全年", Q1: "Q1", Q2: "Q2", Q3: "Q3", Q4: "Q4" };

  // 年度怪物磁鐵（整年拿最多怪物的人）
  const yearBonusKing = (() => {
    const yMap = {};
    sessions.filter(s => (s.date || "").slice(0, 4) === champYear).forEach(s => (s.bonusEvents || []).forEach(b => {
      if (!b.winner || b.type !== "monster") return;
      const k = resolveId(b.winner, members);
      if (!yMap[k]) yMap[k] = { name: dispName(b.winner, members), count: 0 };
      yMap[k].count++;
    }));
    const sorted = Object.values(yMap).sort((a, b) => b.count - a.count);
    return sorted[0] || null;
  })();

  // ─── 特殊牌王（只統計 🐲 怪物，依目前篩選範圍）───
  const bonusMap = {};
  filteredSessions.forEach(s => (s.bonusEvents || []).forEach(b => {
    if (!b.winner) return;
    if (b.type !== "monster") return; // 只算怪物，High Hand 之後取消不統計
    const k = resolveId(b.winner, members);
    if (!bonusMap[k]) bonusMap[k] = { name: dispName(b.winner, members), count: 0, total: 0 };
    bonusMap[k].count++;
    bonusMap[k].total += (b.amount || 0);
  }));
  const bonusRows = Object.values(bonusMap).sort((a, b) => b.count - a.count || b.total - a.total);
  const bonusKing = bonusRows[0] || null;

  const pill = (active) => ({
    padding: "6px 13px", borderRadius: 20, cursor: "pointer", fontSize: 12, fontFamily: "inherit",
    border: `1px solid ${active ? C.gold : C.border}`,
    background: active ? C.gold : "transparent",
    color: active ? "#000" : C.dim,
    fontWeight: active ? 700 : 400, whiteSpace: "nowrap",
  });

  return (
    <div>
      {/* 戰鬥紀錄 */}
      <div style={{ marginBottom: 22 }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9, maxWidth: 520 }}>
          {/* 年度卡：頭號公敵 / 深海明珠 / 怪物磁鐵 */}
          <div style={{
            gridColumn: "1 / -1",
            background: yearStat.champ ? "linear-gradient(135deg,rgba(201,168,76,.2),rgba(201,168,76,.05))" : C.surface,
            border: `1px solid ${yearStat.champ ? C.gold : C.border}`, borderRadius: 8, padding: "8px 14px",
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 10, color: C.gold, letterSpacing: "0.1em" }}>{champYear} 年度</span>
              <span style={{ fontSize: 9, color: C.dim }}>{yearStat.sessionCount} 場</span>
            </div>
            {yearStat.champ ? (
              <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: "4px 12px", marginTop: 5 }}>
                <span>
                  <span style={{ fontSize: 9, color: C.dim, display: "block" }}>🦈 頭號公敵</span>
                  <span style={{ fontSize: 14, fontWeight: 700, color: C.goldLight }}>{yearStat.champ.name}</span>
                  <span style={{ fontFamily: "monospace", fontSize: 11, fontWeight: 700, color: C.green, marginLeft: 5 }}>{fmt(yearStat.champ.total)}</span>
                </span>
                {yearStat.loser && (
                  <span>
                    <span style={{ fontSize: 9, color: C.dim, display: "block" }}>💸 深海明珠</span>
                    <span style={{ fontSize: 14, fontWeight: 700, color: C.red }}>{yearStat.loser.name}</span>
                    <span style={{ fontFamily: "monospace", fontSize: 11, fontWeight: 700, color: C.red, marginLeft: 5 }}>{fmt(yearStat.loser.total)}</span>
                  </span>
                )}
                {yearBonusKing && (
                  <span>
                    <span style={{ fontSize: 9, color: C.dim, display: "block" }}>⚡️ 怪物磁鐵</span>
                    <span style={{ fontSize: 14, fontWeight: 700, color: C.goldLight }}>{yearBonusKing.name}</span>
                    <span style={{ fontFamily: "monospace", fontSize: 11, fontWeight: 700, color: C.gold, marginLeft: 5 }}>×{yearBonusKing.count}</span>
                  </span>
                )}
              </div>
            ) : (
              <div style={{ fontSize: 12, color: C.dim, marginTop: 4 }}>尚無資料</div>
            )}
          </div>
          {/* Q1-Q4 兩欄 */}
          {quarterChamps.map(({ q, champ, loser, sessionCount }) => (
            <div key={q} style={{
              background: champ ? "linear-gradient(135deg,rgba(201,168,76,.14),rgba(201,168,76,.04))" : C.surface,
              border: `1px solid ${champ ? C.gold : C.border}`, borderRadius: 8, padding: "7px 12px",
            }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={{ fontSize: 10, color: C.dim, letterSpacing: "0.1em" }}>{Q_LABELS[q]}</span>
                {champ && <span style={{ fontSize: 9, color: C.dim }}>{sessionCount} 場</span>}
              </div>
              {champ ? (
                <div style={{ marginTop: 3 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: C.goldLight }}>🦈 {champ.name} <span style={{ fontFamily: "monospace", fontSize: 11, color: C.green }}>{fmt(champ.total)}</span></div>
                  {loser && (
                    <div style={{ marginTop: 2, fontSize: 13, fontWeight: 700, color: C.red }}>💸 {loser.name} <span style={{ fontFamily: "monospace", fontSize: 11 }}>{fmt(loser.total)}</span></div>
                  )}
                </div>
              ) : (
                <div style={{ fontSize: 12, color: C.dim, paddingTop: 2 }}>尚無資料</div>
              )}
            </div>
          ))}
        </div>
      </div>

      {/* 年份 + 季度篩選 */}
      <div style={{ marginBottom: 18 }}>
        <div style={{ display: "flex", gap: 7, marginBottom: 10, flexWrap: "wrap", alignItems: "center" }}>
          <span style={{ fontSize: 11, color: C.dim, marginRight: 4 }}>年份</span>
          <button onClick={() => setFilterYear("all")} style={pill(filterYear === "all")}>全部</button>
          {years.map(y => (
            <button key={y} onClick={() => setFilterYear(y)} style={pill(filterYear === y)}>{y}</button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 7, flexWrap: "wrap", alignItems: "center" }}>
          <span style={{ fontSize: 11, color: C.dim, marginRight: 4 }}>季度</span>
          {["all", "Q1", "Q2", "Q3", "Q4"].map(q => (
            <button key={q} onClick={() => setFilterQ(q)} style={pill(filterQ === q)}>{Q_LABELS[q]}</button>
          ))}
        </div>
      </div>

      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
          <thead>
            <tr>{["名次","姓名","出席","累計輸贏","每場平均","最佳場","最差場"].map(h => (
              <th key={h} style={{ textAlign: "left", padding: "8px 12px", borderBottom: `1px solid ${C.gold}`, color: C.gold, fontSize: 11, fontWeight: 400, letterSpacing: "0.1em", fontFamily: "monospace" }}>{h}</th>
            ))}</tr>
          </thead>
          <tbody>
            {rows.map((r, i) => {
              const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1);
              return (
              <tr key={i} style={{ borderBottom: `1px solid ${C.border}` }}>
                <td style={{ padding: "7px 12px", fontFamily: "monospace", color: i < 3 ? C.gold : C.dim, fontWeight: i < 3 ? 700 : 400, fontSize: i < 3 ? 15 : 13 }}>{medal}</td>
                <td style={{ padding: "7px 12px" }}>{r.name}</td>
                <td style={{ padding: "7px 12px", fontFamily: "monospace" }}>{r.count}</td>
                <td style={{ padding: "7px 12px", fontFamily: "monospace", fontWeight: 700, color: r.total >= 0 ? C.green : C.red }}>{fmt(r.total)}</td>
                <td style={{ padding: "7px 12px", fontFamily: "monospace", color: (r.count > 0 ? r.total / r.count : 0) >= 0 ? C.green : C.red }}>{r.count > 0 ? fmt(Math.round(r.total / r.count)) : "-"}</td>
                <td style={{ padding: "7px 12px", fontFamily: "monospace", color: C.green }}>{r.best === -Infinity ? "-" : fmt(r.best)}</td>
                <td style={{ padding: "7px 12px", fontFamily: "monospace", color: C.red }}>{r.worst === Infinity ? "-" : fmt(r.worst)}</td>
              </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* 怪物排行 */}
      {bonusRows.length > 0 && (
        <div style={{ marginTop: 26 }}>
          <div style={{ fontSize: 12, color: C.gold, letterSpacing: "0.1em", marginBottom: 10, fontFamily: "monospace" }}>
            🐲 怪物排行
          </div>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr>{["名次","姓名","次數","獎金合計"].map(h => (
                  <th key={h} style={{ textAlign: "left", padding: "8px 12px", borderBottom: `1px solid ${C.gold}`, color: C.gold, fontSize: 11, fontWeight: 400, letterSpacing: "0.1em", fontFamily: "monospace" }}>{h}</th>
                ))}</tr>
              </thead>
              <tbody>
                {bonusRows.map((r, i) => (
                  <tr key={i} style={{ borderBottom: `1px solid ${C.border}` }}>
                    <td style={{ padding: "7px 12px", fontFamily: "monospace", color: i === 0 ? C.gold : C.dim, fontWeight: i === 0 ? 700 : 400, fontSize: i === 0 ? 15 : 13 }}>{i === 0 ? "🐲" : (i + 1)}</td>
                    <td style={{ padding: "7px 12px" }}>{r.name}</td>
                    <td style={{ padding: "7px 12px", fontFamily: "monospace", fontWeight: 700, color: C.goldLight }}>{r.count}</td>
                    <td style={{ padding: "7px 12px", fontFamily: "monospace", color: C.green }}>{fmtAbs(r.total)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* 來賓紀錄（不佔排名） */}
      {guestRows.length > 0 && (
        <div style={{ marginTop: 26 }}>
          <div style={{ fontSize: 12, color: C.dim, letterSpacing: "0.1em", marginBottom: 10, fontFamily: "monospace" }}>
            👤 來賓紀錄（不列入排名）
          </div>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, opacity: 0.75 }}>
              <thead>
                <tr>{["姓名","出席","累計輸贏","每場平均"].map(h => (
                  <th key={h} style={{ textAlign: "left", padding: "8px 12px", borderBottom: `1px solid ${C.border}`, color: C.dim, fontSize: 11, fontWeight: 400, letterSpacing: "0.1em", fontFamily: "monospace" }}>{h}</th>
                ))}</tr>
              </thead>
              <tbody>
                {guestRows.map((r, i) => (
                  <tr key={i} style={{ borderBottom: `1px solid ${C.border}` }}>
                    <td style={{ padding: "7px 12px" }}>{r.name} <span style={{ fontSize: 10, color: C.dim }}>客</span></td>
                    <td style={{ padding: "7px 12px", fontFamily: "monospace" }}>{r.count}</td>
                    <td style={{ padding: "7px 12px", fontFamily: "monospace", fontWeight: 700, color: r.total >= 0 ? C.green : C.red }}>{fmt(r.total)}</td>
                    <td style={{ padding: "7px 12px", fontFamily: "monospace", color: (r.count > 0 ? r.total / r.count : 0) >= 0 ? C.green : C.red }}>{r.count > 0 ? fmt(Math.round(r.total / r.count)) : "-"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

// TAB: RESERVE
// ═══════════════════════════════════════════════════════
function TabReserve({ data, setData }) {
  const dialog = useDialog();
  const { sessions, expenses = [] } = data;
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({ date: "", amount: "", desc: "" });
  const [showLedger, setShowLedger] = useState(false);

  const events = [
    ...sessions.map(s => ({ date: s.date, amount: calcReserve(s), note: s.note, kind: "session", id: s.id })),
    ...expenses.map(e => ({ date: e.date, amount: -e.amount, note: e.desc, kind: "expense", id: e.id })),
  ].sort((a, b) => a.date < b.date ? -1 : 1);

  let run = 0;
  const items = events.map(ev => { run += ev.amount; return { ...ev, run }; });
  const total = run;

  // ─── 成本分析 ───
  const nSess = sessions.length || 1;
  const sumOf = k => sessions.reduce((a, s) => a + (s[k] || 0), 0);
  const cVenue = sumOf("venueFee");
  const cWage = sumOf("dealerWage");
  const cHelper = sumOf("helperTip");
  const cMeal = expenses.filter(e => (e.desc || "").includes("餐費")).reduce((a, e) => a + e.amount, 0);
  const cOther = expenses.reduce((a, e) => a + e.amount, 0) - cMeal;
  const refJackpot = sumOf("jackpot");
  const costTotal = cVenue + cWage + cHelper + cMeal + cOther + refJackpot;
  const refWater = sumOf("totalWater");
  const avg = v => Math.round(v / nSess);

  const saveExpense = () => {
    if (!form.date || !form.amount) { dialog.alert("請填日期和金額"); return; }
    const newExp = { id: "e" + Date.now(), date: form.date, amount: parseInt(form.amount) || 0, desc: form.desc };
    setData(d => ({ ...d, expenses: [...(d.expenses || []), newExp].sort((a, b) => a.date < b.date ? -1 : 1) }));
    setModal(false); setForm({ date: "", amount: "", desc: "" });
  };

  return (
    <div>
      <div style={{ display: "flex", gap: 14, alignItems: "flex-start", marginBottom: 20, flexWrap: "wrap" }}>
        <div style={{ background: "linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05))", border: `1px solid ${C.gold}`, borderRadius: 8, padding: "16px 24px", textAlign: "center" }}>
          <div style={{ fontSize: 10, color: C.dim, letterSpacing: "0.14em", marginBottom: 6 }}>公積金餘額</div>
          <div style={{ fontFamily: "monospace", fontSize: 28, fontWeight: 700, color: C.goldLight }}>${fmtAbs(total)}</div>
        </div>
        <Btn onClick={() => setModal(true)} style={{ alignSelf: "flex-end" }}>－ 新增支出</Btn>
      </div>

      {/* ─── 成本分析 ─── */}
      <div style={{ marginTop: 30, marginBottom: 20 }}>
        <SectionHeader>💰 成本分析</SectionHeader>
        <div style={{ fontSize: 11, color: C.dim, margin: "8px 0 12px", fontFamily: "monospace" }}>
          {nSess} 場{sessions.length ? `（${sessions[0].date} ~ ${sessions[sessions.length - 1].date}）` : ""}
        </div>

        {/* 總成本大字 */}
        <div style={{ background: "linear-gradient(135deg,rgba(216,112,112,.14),rgba(216,112,112,.04))",
          border: `1px solid ${C.red}77`, borderRadius: 8, padding: "14px 18px", marginBottom: 14,
          display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
          <div>
            <div style={{ fontSize: 10, color: C.dim, letterSpacing: "0.14em", marginBottom: 4 }}>總支出</div>
            <div style={{ fontFamily: "monospace", fontSize: 24, fontWeight: 700, color: C.red }}>${fmtAbs(costTotal)}</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 10, color: C.dim, letterSpacing: "0.14em", marginBottom: 4 }}>平均每場</div>
            <div style={{ fontFamily: "monospace", fontSize: 24, fontWeight: 700, color: C.goldLight }}>${fmtAbs(avg(costTotal))}</div>
          </div>
        </div>

        {/* 明細 */}
        <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: "6px 14px", marginBottom: 12 }}>
          {[
            { label: "🏠 場地費", v: cVenue },
            { label: "👔 Dealer 薪", v: cWage },
            { label: "🧑‍💼 管家小費", v: cHelper },

// TAB: MEMBERS
// ═══════════════════════════════════════════════════════
function TabMembers({ data, setData }) {
  const { members } = data;
  const [modal, setModal] = useState(false);
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState({ name: "", aliases: "", bank: "", type: "member" });
  const [defaultType, setDefaultType] = useState("member");

  const TYPE_LABEL = { member: "成員", dealer: "Dealer", guest: "來賓", venue: "場地" };
  const TYPE_COLOR = { member: C.blue, dealer: C.gold, guest: C.accent, venue: C.green };

  const openAdd = (type) => { setDefaultType(type); setEditId(null); setForm({ name: "", aliases: "", bank: "", type }); setModal(true); };
  const openEdit = (m) => { setEditId(m.id); setForm({ name: m.name, aliases: m.aliases.join(","), bank: m.bank, type: m.type }); setModal(true); };

  const dialog = useDialog();
  const save = async () => {
    const name = form.name.trim();
    if (!name) { await dialog.alert("請填名稱"); return; }
    const aliases = form.aliases.split(",").map(a => a.trim()).filter(Boolean);
    if (!aliases.includes(name)) aliases.unshift(name);
    if (editId) {
      const entry = { id: editId, name, aliases, bank: form.bank, type: form.type };
      setData(d => ({ ...d, members: d.members.map(m => m.id === editId ? entry : m) }));
    } else {
      if (members.find(m => m.id === name)) { await dialog.alert(`名稱「${name}」已存在，請改用其他名稱`); return; }
      const entry = { id: name, name, aliases, bank: form.bank, type: form.type };
      setData(d => ({ ...d, members: [...d.members, entry] }));
    }
    setModal(false);
  };

  const del = async () => {
    if (!(await dialog.confirm("確定刪除？"))) return;
    setData(d => ({ ...d, members: d.members.filter(m => m.id !== editId) }));
    setModal(false);
  };

  const order = { member: 0, dealer: 1, venue: 2, guest: 3 };
  const sorted = [...members].sort((a, b) => (order[a.type] ?? 9) - (order[b.type] ?? 9) || a.name.localeCompare(b.name));

  return (
    <div>
      <div style={{ marginBottom: 14, display: "flex", gap: 8, flexWrap: "wrap" }}>
        <Btn onClick={() => openAdd("member")}>＋ 新增成員</Btn>
        <Btn variant="accent" onClick={() => openAdd("guest")}>＋ 新增來賓</Btn>
        <Btn variant="dark" onClick={() => openAdd("dealer")}>＋ 新增Dealer</Btn>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(250px,1fr))", gap: 10 }}>
        {sorted.map(m => (
          <div key={m.id} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 6, padding: "12px 14px", display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 14, fontWeight: 600 }}>
                {m.name}
                <span style={{ fontSize: 10, padding: "1px 5px", borderRadius: 3, marginLeft: 5, background: (TYPE_COLOR[m.type] || C.dim) + "22", color: TYPE_COLOR[m.type] || C.dim, border: `1px solid ${(TYPE_COLOR[m.type] || C.dim)}44` }}>
                  {TYPE_LABEL[m.type] || m.type}
                </span>
              </div>
              <div style={{ fontSize: 11, color: C.dim, marginTop: 2 }}>別名：{m.aliases.join("、")}</div>
              <div style={{ fontFamily: "monospace", fontSize: 11, color: C.muted, marginTop: 2 }}>{m.bank || "—"}</div>
            </div>
            <button onClick={() => openEdit(m)} style={{ background: "transparent", border: `1px solid ${C.border}`, color: C.dim, padding: "3px 9px", borderRadius: 4, cursor: "pointer", fontSize: 11, whiteSpace: "nowrap" }}>編輯</button>
          </div>
        ))}
      </div>

      <Modal open={modal} title={editId ? `編輯：${form.name}` : `新增${TYPE_LABEL[defaultType]}`} onClose={() => setModal(false)} onSave={save}>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <Input label="顯示名稱" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="名稱" />
          <Input label="別名（逗號分隔）" value={form.aliases} onChange={e => setForm(f => ({ ...f, aliases: e.target.value }))} placeholder="別名1,別名2" />
          <Input label="銀行帳號（選填）" value={form.bank} onChange={e => setForm(f => ({ ...f, bank: e.target.value }))} placeholder="e.g. 012-123456789" />
          <Select label="類型" value={form.type} onChange={e => setForm(f => ({ ...f, type: e.target.value }))}>
            <option value="member">成員</option>
            <option value="guest">來賓</option>
            <option value="dealer">Dealer</option>
            <option value="venue">場地</option>
          </Select>
          {editId && <Btn variant="danger" onClick={del} style={{ marginTop: 4 }}>🗑 刪除成員</Btn>}
        </div>
      </Modal>
    </div>
  );
}

// TAB: BACKUP / RESTORE
// ═══════════════════════════════════════════════════════
const BACKUP_KEY = "pokerclub_backups";

function TabBackup({ data, setData }) {
  const dialog = useDialog();
  const [exportText, setExportText] = useState("");
  const [importText, setImportText] = useState("");
  const [msg, setMsg] = useState("");
  const [showCloud, setShowCloud] = useState(false);
  const [cloudBackups, setCloudBackups] = useState([]);
  const [cloudBusy, setCloudBusy] = useState(false);
  const [note, setNote] = useState("");

  const showMsg = (text, isErr = false) => {
    setMsg({ text, isErr });
    setTimeout(() => setMsg(""), 4000);
  };

  // ── 主要備份方式：複製貼上 JSON ──
  const generateExport = () => {
    setExportText(JSON.stringify(data, null, 2));
    showMsg("✅ 已產生 JSON，請複製文字框內容並貼到備忘錄/LINE 保存");
  };

  const copyToClipboard = async () => {
    if (!exportText) {
      showMsg("⚠️ 請先按「產生備份 JSON」", true);
      return;
    }
    try {
      await navigator.clipboard.writeText(exportText);
      showMsg("✅ 已複製到剪貼簿");
    } catch (e) {
      showMsg("❌ 自動複製失敗，請手動長按文字框選取後複製", true);
    }
  };

  const importFromText = async () => {
    if (!importText.trim()) {
      showMsg("⚠️ 請貼上備份 JSON 文字", true);
      return;
    }
    if (!(await dialog.confirm("匯入後當前資料會被覆蓋，確定？"))) return;
    try {
      const parsed = JSON.parse(importText);
      if (!parsed.sessions || !parsed.members) throw new Error("格式不正確：缺少 sessions 或 members");
      setData(() => parsed);
      setImportText("");
      showMsg("✅ 匯入成功");
    } catch (e) {
      showMsg("❌ 匯入失敗：" + e.message, true);
    }
  };

  // ── 雲端備份：使用 Firestore 子集合 ──
  const loadCloudBackups = async () => {
    setCloudBusy(true);
    try {
      const fb = await getFirebase();
      const colRef = fb.collection(fb.db, BACKUP_COL);
      const q = fb.query(colRef, fb.orderBy("ts", "desc"), fb.limit(20));
      const snap = await fb.getDocs(q);
      const list = [];
      snap.forEach(d => {
        const x = d.data();
        list.push({
          id: d.id, ts: x.ts, note: x.note || "",
          sessionCount: x.sessionCount, memberCount: x.memberCount, expenseCount: x.expenseCount,
          sizeKB: x.sizeKB || 0,
        });
      });
      setCloudBackups(list);
    } catch (e) {
      console.error(e);
      setCloudBackups([]);
    }
    setCloudBusy(false);
  };

  useEffect(() => {
    if (showCloud) loadCloudBackups();
  }, [showCloud]);

  const createCloudBackup = async () => {
    setCloudBusy(true);
    try {
      const fb = await getFirebase();
      const id = "b" + Date.now();
      const snapshot = JSON.stringify(data);
      const sizeKB = Math.round(snapshot.length / 1024);
      await fb.setDoc(fb.doc(fb.db, BACKUP_COL, id), {
        ts: Date.now(), note: note || "",
        sessionCount: data.sessions.length,
        memberCount: data.members.length,
        expenseCount: (data.expenses || []).length,
        sizeKB, snapshot,
      });
      await loadCloudBackups();
      setNote("");
      showMsg(`✅ 雲端備份已建立 (${sizeKB}KB)`);
    } catch (e) {
      showMsg("❌ 雲端備份失敗：" + e.message, true);
    }
    setCloudBusy(false);
  };

  const restoreCloud = async (backup) => {
    if (!(await dialog.confirm(`還原到 ${new Date(backup.ts).toLocaleString("zh-TW")} 的備份？當前資料會被覆蓋`))) return;
    try {
      const fb = await getFirebase();
      const snap = await fb.getDoc(fb.doc(fb.db, BACKUP_COL, backup.id));
      if (!snap.exists()) throw new Error("找不到備份內容");
      const restored = JSON.parse(snap.data().snapshot);
      setData(() => restored);
      showMsg("✅ 已還原");
    } catch (e) {
      showMsg("❌ 還原失敗：" + e.message, true);
    }
  };

  const deleteCloud = async (id) => {
    if (!(await dialog.confirm("確定刪除此備份？"))) return;
    try {
      const fb = await getFirebase();
      await fb.deleteDoc(fb.doc(fb.db, BACKUP_COL, id));
      setCloudBackups(cloudBackups.filter(b => b.id !== id));
      showMsg("已刪除");
    } catch (e) {
      showMsg("❌ 刪除失敗：" + e.message, true);
    }
  };

  const clearAllCloud = async () => {
    if (!(await dialog.confirm("確定清空所有雲端備份？"))) return;
    try {
      const fb = await getFirebase();
      for (const b of cloudBackups) {
        try { await fb.deleteDoc(fb.doc(fb.db, BACKUP_COL, b.id)); } catch {}
      }
      setCloudBackups([]);
      showMsg("✅ 已清空");
    } catch (e) {
      showMsg("❌ 清空失敗：" + e.message, true);
    }
  };

  const fmtDate = (ts) => new Date(ts).toLocaleString("zh-TW", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });

  return (
    <div style={{ maxWidth: 720 }}>
      {msg && (
        <div style={{ background: msg.isErr ? C.red+"22" : C.green+"22",
          border: `1px solid ${msg.isErr ? C.red : C.green}44`,
          color: msg.isErr ? C.red : C.green,
          padding: "8px 14px", borderRadius: 4, marginBottom: 14, fontSize: 13 }}>{msg.text}</div>
      )}

      {/* 主要備份：複製貼上 JSON（最可靠） */}
      <div style={{ background: C.surface, border: `1px solid ${C.gold}`, borderRadius: 8, padding: 18, marginBottom: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: C.goldLight, marginBottom: 6 }}>
          💾 備份 JSON（推薦使用）
        </div>
        <div style={{ fontSize: 11, color: C.dim, marginBottom: 12, lineHeight: 1.5 }}>
          這是最可靠的方式：產生 JSON 文字後複製貼到備忘錄或 LINE 保存。<br />
          目前資料：{data.sessions.length} 場 · {data.members.length} 成員 · {(data.expenses || []).length} 公積金支出
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
          <Btn onClick={generateExport}>📋 產生備份 JSON</Btn>
          {exportText && <Btn variant="secondary" onClick={copyToClipboard}>📑 一鍵複製</Btn>}
        </div>
        {exportText && (
          <textarea readOnly value={exportText} onClick={e => e.target.select()}
            style={{ width: "100%", minHeight: 120, background: C.surface2, border: `1px solid ${C.border}`,
              color: C.text, padding: 10, borderRadius: 4, fontFamily: "monospace", fontSize: 11,
              outline: "none", resize: "vertical", boxSizing: "border-box" }} />
        )}
      </div>

      {/* 重置為內建資料 */}
      <div style={{ background: C.surface, border: `1px solid ${C.red}55`, borderRadius: 8, padding: 18, marginBottom: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: C.red, marginBottom: 6 }}>
          🔧 重置為內建預設資料（{USER_DEFAULT_DATA.sessions.length}場 + {USER_DEFAULT_DATA.members.length}成員）
        </div>
        <div style={{ fontSize: 11, color: C.dim, marginBottom: 10, lineHeight: 1.5 }}>
          ⚠️ 用於修復 Firebase 上的損壞資料 — 會把當前 Firebase 上的資料蓋掉，恢復成 HTML 內建的版本（包含 {USER_DEFAULT_DATA.sessions.length} 場、{USER_DEFAULT_DATA.members.length} 成員、{USER_DEFAULT_DATA.expenses.length} 筆公積金支出，內建資料最後更新到 {USER_DEFAULT_DATA.sessions.length ? USER_DEFAULT_DATA.sessions[USER_DEFAULT_DATA.sessions.length - 1].date : "-"}）。如果你看到亂碼或資料不對，按這個。
        </div>
        <Btn variant="danger" onClick={async () => {
          if (!(await dialog.confirm("確定用內建資料覆蓋當前 Firebase？\n\n這會清除所有目前的資料！如果你最近有新增場次，務必先複製 JSON 備份！"))) return;
          if (!(await dialog.confirm("再確認一次：真的要覆蓋？"))) return;
          setData(() => USER_DEFAULT_DATA);
          showMsg("✅ 已重置為內建資料");
        }}>🔧 用內建資料覆蓋</Btn>
      </div>

      {/* 從 JSON 還原 */}
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: 18, marginBottom: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: C.goldLight, marginBottom: 6 }}>
          🔄 從 JSON 還原
        </div>
        <div style={{ fontSize: 11, color: C.dim, marginBottom: 10 }}>把先前複製的 JSON 文字貼進來，按「匯入」即可還原</div>
        <textarea value={importText} onChange={e => setImportText(e.target.value)}
          placeholder="貼上 JSON 文字..."
          style={{ width: "100%", minHeight: 100, background: C.surface2, border: `1px solid ${C.border}`,
            color: C.text, padding: 10, borderRadius: 4, fontFamily: "monospace", fontSize: 11,
            outline: "none", resize: "vertical", boxSizing: "border-box", marginBottom: 10 }} />
        <Btn onClick={importFromText}>⬆️ 匯入</Btn>
      </div>

      {/* 雲端備份（折疊） */}
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: 18 }}>
        <div onClick={() => setShowCloud(!showCloud)}
          style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: C.dim }}>
            🗂 雲端備份歷史 {showCloud ? "▼" : "▶"}
          </div>
          <span style={{ fontSize: 11, color: C.muted }}>（不穩定，僅作輔助）</span>
        </div>

        {showCloud && (
          <div style={{ marginTop: 14 }}>
            <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap", alignItems: "stretch" }}>
              <input type="text" placeholder="備註（選填）"
                value={note} onChange={e => setNote(e.target.value)}
                style={{ flex: 1, minWidth: 120, background: C.surface2, border: `1px solid ${C.border}`, color: C.text,
                  padding: "7px 10px", borderRadius: 4, fontSize: 13, outline: "none" }} />
              <Btn onClick={createCloudBackup} disabled={cloudBusy}>📸 雲端備份</Btn>
              {cloudBackups.length > 0 && (
                <button onClick={clearAllCloud} style={{ background: "transparent", border: `1px solid ${C.red}55`,
                  color: C.red, padding: "0 12px", borderRadius: 4, cursor: "pointer", fontSize: 11, fontFamily: "inherit" }}>
                  🗑 清空
                </button>
              )}
            </div>
            {cloudBusy ? <div style={{ color: C.dim, fontSize: 13 }}>讀取中...</div>
              : cloudBackups.length === 0 ? <div style={{ color: C.muted, fontSize: 13, textAlign: "center", padding: "16px 0" }}>沒有雲端備份</div>
              : cloudBackups.map(b => (
                <div key={b.id} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 6,
                  padding: "10px 14px", marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontFamily: "monospace", fontSize: 12, color: C.goldLight }}>{fmtDate(b.ts)}</div>
                    <div style={{ fontSize: 10, color: C.dim, marginTop: 2 }}>
                      {b.sessionCount}場 · {b.memberCount}成員{b.sizeKB ? ` · ${b.sizeKB}KB` : ""}{b.note && ` · ${b.note}`}
                    </div>
                  </div>
                  <Btn variant="secondary" onClick={() => restoreCloud(b)} style={{ fontSize: 10, padding: "4px 10px" }}>🔄 還原</Btn>
                  <button onClick={() => deleteCloud(b.id)}
                    style={{ background: "transparent", border: `1px solid ${C.border}`, color: C.muted,
                      padding: "4px 8px", borderRadius: 4, cursor: "pointer", fontSize: 10 }}>🗑</button>
                </div>
              ))
            }
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// 私人帳本頁面
// ═══════════════════════════════════════════════════════
const PRIV_CATS = [
  { id: "mahjong", label: "🀄️ 麻將",   color: C.green },
  { id: "poker",   label: "♠️ Poker",  color: C.gold  },
  { id: "golf",    label: "⛳️ 高爾夫", color: C.blue  },
  { id: "other",   label: "📎 其他",   color: C.accent },
];
const privCat = id => PRIV_CATS.find(c => c.id === id) || PRIV_CATS[3];
const privToday = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};

function PrivateApp() {
  const dialog = useDialog();
  const [entries, setEntries] = useState(() => (window.__privData && window.__privData.entries) || []);
  const [backups, setBackups] = useState(() => (window.__privData && window.__privData.backups) || []);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const [filter, setFilter] = useState("all");
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState({ date: privToday(), cat: "poker", sign: 1, amount: "", note: "" });
  const [lastAutoBak, setLastAutoBak] = useState(() => (window.__privData && window.__privData.lastAutoBak) || "");
  const [showBak, setShowBak] = useState(false);
  const [pasteBox, setPasteBox] = useState(false);
  const [pasteText, setPasteText] = useState("");
  const [copied, setCopied] = useState("");

  const persist = useCallback(async (payload) => {
    const full = {
      entries: payload.entries,
      backups: payload.backups,
      lastAutoBak: payload.lastAutoBak !== undefined
        ? payload.lastAutoBak
        : ((window.__privData && window.__privData.lastAutoBak) || ""),
    };
    setEntries(full.entries);
    setBackups(full.backups);
    setLastAutoBak(full.lastAutoBak);
    setSaving(true);
    setError("");
    try {
      const fb = await getFirebase();
      await fb.setDoc(fb.doc(fb.db, PRIV_COL, window.__privId), {
        payload: await privEncrypt(window.__privKey, full),
        updatedAt: Date.now(),
      });
      window.__privData = full;
    } catch (e) {
      setError("儲存失敗：" + (e && e.message ? e.message : e));
    }
    setSaving(false);
  }, []);

  // 每天第一次改動前，先自動存一份當天開始時的快照
  const saveEntries = async (nextEntries) => {
    const today = privToday();
    const prev = entries;
    if (lastAutoBak !== today && prev.length > 0) {
      try {
        const fb = await getFirebase();
        const id = "a" + Date.now() + Math.random().toString(36).slice(2, 8);
        await fb.setDoc(fb.doc(fb.db, PRIV_BAK, id), {
          payload: await privEncrypt(window.__privKey, { entries: prev }),
          updatedAt: Date.now(),
        });
        let nb = [{ id, ts: Date.now(), n: prev.length,
          sum: prev.reduce((a, e) => a + e.amount, 0), auto: true }, ...backups];
        const drop = nb.slice(PRIV_MAX_BAK);
        nb = nb.slice(0, PRIV_MAX_BAK);
        for (const d of drop) { try { await fb.deleteDoc(fb.doc(fb.db, PRIV_BAK, d.id)); } catch (err) {} }
        await persist({ entries: nextEntries, backups: nb, lastAutoBak: today });
        return;
      } catch (e) {
        // 自動備份失敗不能擋住存檔，繼續存
      }
    }
    await persist({ entries: nextEntries, backups });
  };

  const resetForm = () => { setForm({ date: privToday(), cat: "poker", sign: 1, amount: "", note: "" }); setEditId(null); };

  const submit = () => {
    const raw = Math.abs(Math.round(Number(String(form.amount).replace(/[,\s+-]/g, ""))));
    if (!form.date) { dialog.alert("請填日期"); return; }
    if (!Number.isFinite(raw) || raw === 0) { dialog.alert("請填金額"); return; }
    const amt = raw * form.sign;
    const row = { id: editId || ("p" + Date.now()), date: form.date, cat: form.cat, amount: amt, note: (form.note || "").trim() };
    const next = editId
      ? entries.map(e => (e.id === editId ? row : e))
      : [...entries, row];
    next.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    saveEntries(next);
    resetForm();
  };

  const startEdit = (e) => {
    setEditId(e.id);
    setForm({ date: e.date, cat: e.cat, sign: e.amount >= 0 ? 1 : -1, amount: String(Math.abs(e.amount)), note: e.note || "" });
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const remove = async (e) => {
    if (!(await dialog.confirm(`刪除 ${e.date} 的這筆 ${fmt(e.amount)}？`))) return;
    saveEntries(entries.filter(x => x.id !== e.id));
    if (editId === e.id) resetForm();
  };

  // ─── 雲端備份（一樣是加密的）───
  const bakTs = ts => {
    const d = new Date(ts);
    const p = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };

  const makeBackup = async () => {
    if (entries.length === 0) { dialog.alert("還沒有紀錄可以備份"); return; }
    setSaving(true); setError("");
    try {
      const fb = await getFirebase();
      const id = "b" + Date.now() + Math.random().toString(36).slice(2, 8);
      await fb.setDoc(fb.doc(fb.db, PRIV_BAK, id), {
        payload: await privEncrypt(window.__privKey, { entries }),
        updatedAt: Date.now(),
      });
      let nb = [{ id, ts: Date.now(), n: entries.length, sum: entries.reduce((a, e) => a + e.amount, 0) }, ...backups];
      const drop = nb.slice(PRIV_MAX_BAK);
      nb = nb.slice(0, PRIV_MAX_BAK);
      for (const d of drop) { try { await fb.deleteDoc(fb.doc(fb.db, PRIV_BAK, d.id)); } catch (e) {} }
      await persist({ entries, backups: nb });
      setShowBak(true);
    } catch (e) {
      setError("備份失敗：" + (e && e.message ? e.message : e));
      setSaving(false);
    }
  };

  const restoreBackup = async (b) => {
    if (!(await dialog.confirm(`還原到 ${bakTs(b.ts)} 的版本（${b.n} 筆）？\n現在的 ${entries.length} 筆會被蓋掉。`))) return;
    setSaving(true); setError("");
    try {
      const fb = await getFirebase();
      const snap = await fb.getDoc(fb.doc(fb.db, PRIV_BAK, b.id));
      if (!snap.exists() || !snap.data().payload) { setError("找不到這個備份"); setSaving(false); return; }
      const got = await privDecrypt(window.__privKey, snap.data().payload);
      await persist({ entries: Array.isArray(got.entries) ? got.entries : [], backups });
      resetForm();
    } catch (e) {
      setError("還原失敗：" + (e && e.message ? e.message : e));
      setSaving(false);
    }
  };

  const deleteBackup = async (b) => {
    if (!(await dialog.confirm(`刪除 ${bakTs(b.ts)} 這個備份？`))) return;
    try {
      const fb = await getFirebase();
      await fb.deleteDoc(fb.doc(fb.db, PRIV_BAK, b.id));
    } catch (e) {}
    persist({ entries, backups: backups.filter(x => x.id !== b.id) });
  };

  const copyAll = async () => {
    const text = JSON.stringify({ ledger: "LEDGER-private", ts: Date.now(), entries }, null, 1);
    try {
      await navigator.clipboard.writeText(text);
      setCopied("已複製 " + entries.length + " 筆，貼到備忘錄存起來");
    } catch (e) {
      setPasteText(text); setPasteBox(true);
      setCopied("自動複製失敗，請手動全選下面的文字複製");
    }
    setTimeout(() => setCopied(""), 5000);
  };

  const restoreFromText = async () => {
    let got;
    try {
      got = JSON.parse(pasteText);
    } catch (e) { dialog.alert("這段文字看起來不是備份，請確認有整段貼上"); return; }
    if (!got || !Array.isArray(got.entries)) { dialog.alert("這段文字裡找不到紀錄"); return; }
    if (!(await dialog.confirm(`從文字還原 ${got.entries.length} 筆？現在的 ${entries.length} 筆會被蓋掉。`))) return;
    await persist({ entries: got.entries, backups });
    setPasteBox(false); setPasteText(""); resetForm();
  };

  const lock = () => {
    window.__privKey = null; window.__privData = null; window.__privId = null; window.__privMode = false;
    const g = document.getElementById("priv-gate");
    if (g) g.style.display = "flex";
    const i = document.getElementById("priv-pass");
    if (i) i.value = "";
    const c = document.getElementById("priv-confirm");
    if (c) c.style.display = "none";
    try { _privErr(""); } catch (e) {}
    window.dispatchEvent(new Event("__priv_locked"));
  };

  const total = entries.reduce((a, e) => a + e.amount, 0);
  const byCat = PRIV_CATS.map(c => ({
    ...c,
    sum: entries.filter(e => e.cat === c.id).reduce((a, e) => a + e.amount, 0),
    n: entries.filter(e => e.cat === c.id).length,
  }));
  const shown = filter === "all" ? entries : entries.filter(e => e.cat === filter);
  const shownTotal = shown.reduce((a, e) => a + e.amount, 0);

  const box = { background: C.surface, border: `1px solid ${C.border}`, borderRadius: 6, padding: 16 };

  return (
    <div style={{ background: C.bg, minHeight: "100vh", color: C.text, fontFamily: "'Noto Serif TC', serif" }}>
      {/* Header */}
      <div style={{ background: "linear-gradient(135deg,#0a0c10,#12151e)", borderBottom: `1px solid ${C.blue}`,
        padding: "12px 20px", display: "flex", alignItems: "center", justifyContent: "space-between",
        position: "sticky", top: 0, zIndex: 100, gap: 10 }}>
        <div>
          <div style={{ fontSize: 17, fontWeight: 700, color: C.blue, letterSpacing: "0.08em" }}>🔒 私人帳本</div>
          <div style={{ fontSize: 10, color: error ? C.red : C.dim, fontFamily: "monospace", marginTop: 1 }}>
            {error ? "❌ " + error : (saving ? "⏳ 加密儲存中..." : "✓ 已加密同步")}
          </div>
        </div>
        <button onClick={lock} style={{ background: "transparent", border: `1px solid ${C.border}`,
          color: C.dim, padding: "6px 12px", borderRadius: 4, cursor: "pointer", fontSize: 12, fontFamily: "inherit" }}>
          🔓 鎖定
        </button>
      </div>

      <div style={{ maxWidth: 720, margin: "0 auto", padding: "20px 16px" }}>

        {/* 總計 */}
        <div style={{ ...box, textAlign: "center", padding: "22px 16px",
          borderColor: total >= 0 ? C.green + "66" : C.red + "66" }}>
          <div style={{ fontSize: 11, color: C.dim, letterSpacing: "0.16em" }}>總計</div>
          <div style={{ fontSize: 40, fontWeight: 700, fontFamily: "monospace", marginTop: 2, lineHeight: 1.1,
            color: total >= 0 ? C.green : C.red }}>
            {fmt(total)}
          </div>
          <div style={{ fontSize: 11, color: C.dim, marginTop: 4 }}>{entries.length} 筆紀錄</div>
        </div>

        {/* 分項 */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))", gap: 8, marginTop: 10 }}>
          {byCat.map(c => (
            <div key={c.id} style={{ ...box, padding: "12px 14px", display: "flex",
              justifyContent: "space-between", alignItems: "baseline", gap: 8 }}>
              <div>
                <div style={{ fontSize: 13, color: C.text }}>{c.label}</div>
                <div style={{ fontSize: 10, color: C.dim, fontFamily: "monospace" }}>{c.n} 筆</div>
              </div>
              <div style={{ fontFamily: "monospace", fontSize: 17, fontWeight: 700,
                color: c.sum === 0 ? C.dim : (c.sum > 0 ? C.green : C.red) }}>
                {c.sum === 0 ? "—" : fmt(c.sum)}
              </div>
            </div>
          ))}
        </div>

        {/* 新增／編輯 */}
        <div style={{ ...box, marginTop: 16, borderColor: editId ? C.gold : C.border }}>
          <div style={{ fontSize: 13, color: editId ? C.goldLight : C.text, fontWeight: 700, marginBottom: 12 }}>
            {editId ? "✏️ 編輯這筆" : "➕ 記一筆"}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <Input label="日期" type="date" value={form.date}
              onChange={e => setForm(f => ({ ...f, date: e.target.value }))} />
            <Select label="項目" value={form.cat}
              onChange={e => setForm(f => ({ ...f, cat: e.target.value }))}>
              {PRIV_CATS.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
            </Select>
          </div>
          <div style={{ marginTop: 12 }}>
            <label style={{ fontSize: 11, color: C.dim, letterSpacing: "0.04em" }}>這場是</label>
            <div style={{ display: "flex", gap: 8, marginTop: 5 }}>
              {[{ v: 1, t: "贏", c: C.green }, { v: -1, t: "輸", c: C.red }].map(o => (
                <button key={o.v} type="button" onClick={() => setForm(f => ({ ...f, sign: o.v }))}
                  style={{ flex: 1, padding: "13px 0", borderRadius: 5, cursor: "pointer",
                    fontFamily: "inherit", fontSize: 17, fontWeight: 700, transition: "all .15s",
                    touchAction: "manipulation",
                    background: form.sign === o.v ? o.c : "transparent",
                    color: form.sign === o.v ? "#0a0c10" : C.dim,
                    border: `1px solid ${form.sign === o.v ? o.c : C.border}` }}>
                  {o.t}
                </button>
              ))}
            </div>
          </div>
          <div style={{ marginTop: 10 }}>
            <Input label="金額" type="text" inputMode="numeric" pattern="[0-9]*"
              placeholder="例：12000" value={form.amount}
              onChange={e => setForm(f => ({ ...f, amount: e.target.value.replace(/[^\d]/g, "") }))}
              style={{ fontSize: 18, padding: "11px 12px",
                color: form.sign === 1 ? C.green : C.red, fontWeight: 700 }} />
          </div>
          <div style={{ marginTop: 10 }}>
            <Input label="備註（選填）" type="text" placeholder="地點、對象、任何你想記的"
              value={form.note} onChange={e => setForm(f => ({ ...f, note: e.target.value }))} />
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
            <Btn onClick={submit} style={{ flex: 1 }}>{editId ? "更新" : "新增"}</Btn>
            {editId && <Btn variant="secondary" onClick={resetForm}>取消</Btn>}
          </div>
        </div>

        {/* 篩選 */}
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 20 }}>
          {[{ id: "all", label: "全部" }, ...PRIV_CATS].map(c => (
            <button key={c.id} onClick={() => setFilter(c.id)}
              style={{ background: filter === c.id ? "rgba(74,144,217,.14)" : "transparent",
                border: `1px solid ${filter === c.id ? C.blue : C.border}`,
                color: filter === c.id ? C.blue : C.dim,
                padding: "5px 11px", borderRadius: 4, cursor: "pointer",
                fontFamily: "inherit", fontSize: 12 }}>
              {c.label}
            </button>
          ))}
        </div>

        {/* 清單 */}
        <div style={{ marginTop: 12 }}>
          <SectionHeader>
            紀錄　{shown.length} 筆　{shown.length > 0 && <span style={{ color: shownTotal >= 0 ? C.green : C.red }}>{fmt(shownTotal)}</span>}
          </SectionHeader>
          {shown.length === 0 ? (
            <div style={{ ...box, textAlign: "center", color: C.dim, fontSize: 13, padding: "28px 16px" }}>
              {entries.length === 0 ? "還沒有紀錄，上面記第一筆吧" : "這個項目還沒有紀錄"}
            </div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {shown.map(e => {
                const c = privCat(e.cat);
                return (
                  <div key={e.id} style={{ ...box, padding: "11px 14px", display: "flex",
                    alignItems: "center", gap: 12, borderLeft: `3px solid ${c.color}` }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 13 }}>
                        <span style={{ fontFamily: "monospace", color: C.dim }}>{e.date}</span>
                        <span style={{ marginLeft: 8 }}>{c.label}</span>
                      </div>
                      {e.note && (
                        <div style={{ fontSize: 11, color: C.dim, marginTop: 3, wordBreak: "break-word" }}>{e.note}</div>
                      )}
                    </div>
                    <div style={{ fontFamily: "monospace", fontSize: 16, fontWeight: 700, flex: "none",
                      color: e.amount >= 0 ? C.green : C.red }}>
                      {fmt(e.amount)}
                    </div>
                    <div style={{ display: "flex", gap: 4, flex: "none" }}>
                      <button onClick={() => startEdit(e)} title="編輯"
                        style={{ background: "transparent", border: `1px solid ${C.border}`, color: C.dim,
                          borderRadius: 3, cursor: "pointer", fontSize: 12, padding: "3px 7px", fontFamily: "inherit" }}>✏️</button>
                      <button onClick={() => remove(e)} title="刪除"
                        style={{ background: "transparent", border: `1px solid ${C.border}`, color: C.dim,
                          borderRadius: 3, cursor: "pointer", fontSize: 12, padding: "3px 7px", fontFamily: "inherit" }}>🗑</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* 備份 */}
        <div style={{ ...box, marginTop: 22, padding: 0, overflow: "hidden" }}>
          <button onClick={() => setShowBak(v => !v)}
            style={{ width: "100%", background: "transparent", border: "none", color: C.text,
              padding: "14px 16px", cursor: "pointer", fontFamily: "inherit", fontSize: 14,
              display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span>🛡️ 備份　<span style={{ color: C.dim, fontSize: 12 }}>{backups.length} 份</span></span>
            <span style={{ color: C.dim, fontSize: 12 }}>{showBak ? "收合 ▲" : "展開 ▼"}</span>
          </button>

          {showBak && (
            <div style={{ padding: "0 16px 16px" }}>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <Btn onClick={makeBackup} disabled={saving} style={{ flex: 1, minWidth: 130 }}>☁️ 立刻備份</Btn>
                <Btn variant="secondary" onClick={copyAll} style={{ flex: 1, minWidth: 130 }}>📋 複製成文字</Btn>
              </div>
              {copied && <div style={{ fontSize: 12, color: C.green, marginTop: 8 }}>{copied}</div>}

              <div style={{ fontSize: 11, color: C.dim, marginTop: 10, lineHeight: 1.7 }}>
                每天第一次記帳或刪除前，系統會自動存一份當天開始的快照，不用你按。
                上面的按鈕是要多存一份的時候用的。<br />
                備份一樣是加密的，最多留 {PRIV_MAX_BAK} 份，超過自動刪最舊的。
              </div>

              {backups.length === 0 ? (
                <div style={{ fontSize: 12, color: C.dim, marginTop: 12, padding: "14px 0", textAlign: "center",
                  borderTop: `1px solid ${C.border}` }}>
                  還沒有備份
                </div>
              ) : (
                <div style={{ marginTop: 12, borderTop: `1px solid ${C.border}`, paddingTop: 10,
                  display: "flex", flexDirection: "column", gap: 6 }}>
                  {backups.map(b => (
                    <div key={b.id} style={{ display: "flex", alignItems: "center", gap: 10,
                      background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 4, padding: "9px 11px" }}>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 12, fontFamily: "monospace", color: C.text }}>
                          {bakTs(b.ts)}
                          {b.auto
                            ? <Tag color={C.green}>自動</Tag>
                            : <Tag color={C.gold}>手動</Tag>}
                        </div>
                        <div style={{ fontSize: 10, color: C.dim, fontFamily: "monospace" }}>
                          {b.n} 筆　{typeof b.sum === "number" ? fmt(b.sum) : ""}
                        </div>
                      </div>
                      <button onClick={() => restoreBackup(b)}
                        style={{ background: "transparent", border: `1px solid ${C.blue}66`, color: C.blue,
                          borderRadius: 3, cursor: "pointer", fontSize: 11, padding: "5px 10px", fontFamily: "inherit" }}>還原</button>
                      <button onClick={() => deleteBackup(b)}
                        style={{ background: "transparent", border: `1px solid ${C.border}`, color: C.dim,
                          borderRadius: 3, cursor: "pointer", fontSize: 11, padding: "5px 8px", fontFamily: "inherit" }}>🗑</button>
                    </div>
                  ))}
                </div>
              )}

              <button onClick={() => setPasteBox(v => !v)}
                style={{ marginTop: 12, background: "transparent", border: "none", color: C.dim,
                  fontSize: 11, cursor: "pointer", fontFamily: "inherit", padding: 0, textDecoration: "underline" }}>
                從文字還原
              </button>
              {pasteBox && (
                <div style={{ marginTop: 8 }}>
                  <textarea value={pasteText} onChange={e => setPasteText(e.target.value)}
                    placeholder="把之前複製的備份文字整段貼進來"
                    style={{ width: "100%", minHeight: 110, boxSizing: "border-box", background: C.surface2,
                      border: `1px solid ${C.border}`, color: C.text, borderRadius: 4, padding: 10,
                      fontFamily: "monospace", fontSize: 11, outline: "none", resize: "vertical" }} />
                  <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                    <Btn onClick={restoreFromText} style={{ flex: 1 }}>還原</Btn>
                    <Btn variant="secondary" onClick={() => { setPasteBox(false); setPasteText(""); }}>取消</Btn>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>

        <div style={{ marginTop: 24, fontSize: 11, color: C.muted, lineHeight: 1.75, textAlign: "center" }}>
          這些紀錄用你的密碼加密後才上傳，<br />
          其他人（包含管理者）打開資料庫只看得到亂碼。
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════
const TABS = [
  { id: "new",      label: "➕ 新增" },
  { id: "records",  label: "📋 場次" },
  { id: "settle",   label: "📝 帳款結算" },
  { id: "cumul",    label: "🗡️ 戰鬥紀錄" },
  { id: "reserve",  label: "🏦 公積金" },
  { id: "bonus",    label: "🃏 特殊牌" },
  { id: "members",  label: "👥 成員" },
  { id: "backup",   label: "🛡️ 備份" },
];

function PokerApp() {
  const isReadonly = typeof window !== "undefined" && window.__readonly === true;
  const visibleTabs = isReadonly ? TABS.filter(t => t.id === "cumul") : TABS;
  const [tab, setTab] = useState(isReadonly ? "cumul" : "new");
  const [data, setDataState] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [editingId, setEditingId] = useState(null);

  const handleEdit = (sessionId) => {
    setEditingId(sessionId);
    setTab("new");
  };

  // Load from Firebase + 即時同步
  const [hasLoaded, setHasLoaded] = useState(false);
  const [error, setError] = useState("");
  const isWritingRef = useRef(false);
  const fbRef = useRef(null);

  useEffect(() => {
    let unsubscribe = null;
    (async () => {
      try {
        const fb = await getFirebase();
        fbRef.current = fb;
        const dataDoc = fb.doc(fb.db, "pokerclub", "main");

        // 第一次載入
        const snap = await fb.getDoc(dataDoc);
        if (snap.exists() && snap.data().payload) {
          setDataState(JSON.parse(snap.data().payload));
        } else {
          await fb.setDoc(dataDoc, { payload: JSON.stringify(USER_DEFAULT_DATA), updatedAt: Date.now() });
          setDataState(USER_DEFAULT_DATA);
        }
        setLoading(false);
        setTimeout(() => setHasLoaded(true), 100);

        // 訂閱即時更新
        unsubscribe = fb.onSnapshot(dataDoc, (snap) => {
          if (isWritingRef.current) return;
          if (snap.exists() && snap.data().payload) {
            setDataState(JSON.parse(snap.data().payload));
          }
        });
      } catch (e) {
        setError("Firebase 連線失敗：" + e.message);
        setDataState(USER_DEFAULT_DATA);
        setLoading(false);
      }
    })();
    return () => { if (unsubscribe) unsubscribe(); };
  }, []);

  // Save to Firebase whenever data changes
  const setData = useCallback((updater) => {
    setDataState(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      if (!hasLoaded || !fbRef.current) return next;

      const fb = fbRef.current;
      const dataDoc = fb.doc(fb.db, "pokerclub", "main");
      isWritingRef.current = true;
      setSaving(true);
      fb.setDoc(dataDoc, { payload: JSON.stringify(next), updatedAt: Date.now() })
        .then(() => {
          setTimeout(() => { setSaving(false); isWritingRef.current = false; }, 500);
        })
        .catch((e) => {
          setSaving(false);
          isWritingRef.current = false;
          setError("儲存失敗：" + e.message);
        });
      return next;
    });
  }, [hasLoaded]);

  if (loading) return (
    <div style={{ background: C.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: C.dim, fontFamily: "monospace" }}>
      載入中...
    </div>
  );

  return (
    <div style={{ background: C.bg, minHeight: "100vh", color: C.text, fontFamily: "'Noto Serif TC', serif" }}>
      {/* Header */}
      <div style={{ background: "linear-gradient(135deg,#0a0c10,#12151e)", borderBottom: `1px solid ${C.gold}`,
        padding: "12px 20px", display: "flex", alignItems: "center", justifyContent: "space-between",
        position: "sticky", top: 0, zIndex: 100, gap: 10, flexWrap: "wrap" }}>
        <div>
          <div style={{ fontSize: 18, fontWeight: 700, color: C.goldLight, letterSpacing: "0.1em" }}>🦈 LEDGER</div>
          <div style={{ fontSize: 10, color: error ? C.red : C.dim, fontFamily: "monospace", marginTop: 1 }}>
            FIREBASE · {error ? "❌ " + error : (saving ? "⏳ 儲存中..." : "✓ 已同步")}
            {isReadonly ? (
              <span style={{ marginLeft: 8, color: C.blue, fontWeight: 700 }}>👁 唯讀模式</span>
            ) : (
              <>
                {typeof window !== "undefined" && window.__currentUser && <span style={{ marginLeft: 8, color: C.gold }}>👤 {window.__currentUser}</span>}
                <button onClick={() => {
                  try { localStorage.removeItem("guandi_user"); } catch(e) {}
                  window.__currentUser = null;
                  if (typeof _showUserGate === "function") _showUserGate();
                }} style={{ marginLeft: 8, background: "transparent", border: `1px solid ${C.border}`,
                  color: C.muted, padding: "0 6px", borderRadius: 3, cursor: "pointer", fontSize: 9, fontFamily: "inherit" }}>切換</button>
              </>
            )}
          </div>
        </div>
        <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
          {visibleTabs.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)}
              style={{ background: tab === t.id ? "rgba(201,168,76,.12)" : "transparent",
                border: `1px solid ${tab === t.id ? C.gold : C.border}`,
                color: tab === t.id ? C.gold : C.dim,
                padding: "5px 11px", borderRadius: 4, cursor: "pointer",
                fontFamily: "inherit", fontSize: 12, transition: "all .15s" }}>
              {t.label}
            </button>
          ))}
          <button onClick={() => { try { _privShowGate("app"); } catch (e) {} }}
            title="私人帳本（需要自己的密碼）"
            style={{ background: "transparent", border: `1px dashed ${C.border}`,
              color: C.dim, padding: "5px 11px", borderRadius: 4, cursor: "pointer",
              fontFamily: "inherit", fontSize: 12, transition: "all .15s" }}>
            🔒 私人
          </button>
        </div>
      </div>

      {/* Body */}
      <div style={{ maxWidth: 1200, margin: "0 auto", padding: "22px 16px" }}>
        {/* 未結算場次提示橫條（唯讀模式不顯示） */}
        {!isReadonly && (() => {
          const unsettled = data.sessions.filter(s => !s.settled);
          if (unsettled.length === 0) return null;
          return (
            <div style={{ background: C.red+"15", border: `1px solid ${C.red}55`, borderRadius: 6,
              padding: "10px 14px", marginBottom: 14, display: "flex", justifyContent: "space-between",
              alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <div style={{ fontSize: 13, color: C.red, fontWeight: 600 }}>
                📌 進行中：{unsettled.map(s => s.date).join("、")}
              </div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {unsettled.map(s => (
                  <button key={s.id} onClick={() => handleEdit(s.id)}
                    style={{ background: C.red+"22", border: `1px solid ${C.red}66`, color: C.red,
                      padding: "4px 10px", borderRadius: 4, cursor: "pointer", fontSize: 12, fontFamily: "inherit", fontWeight: 600 }}>
                    繼續編輯 {s.date}
                  </button>
                ))}
              </div>
            </div>
          );
        })()}
        <div style={{ marginBottom: 16 }}>
          <SectionHeader>{TABS.find(t => t.id === tab)?.label || ""}</SectionHeader>
        </div>
        {isReadonly ? (
          <TabCumul data={data} />
        ) : (
          <>
            {tab === "records"  && <TabRecords  data={data} setData={setData} onEdit={handleEdit} />}
            {tab === "new"      && <TabNew      data={data} setData={setData} editingId={editingId} clearEditing={() => setEditingId(null)} />}
            {tab === "settle"   && <TabSettle   data={data} setData={setData} />}
            {tab === "cumul"    && <TabCumul    data={data} />}
            {tab === "reserve"  && <TabReserve  data={data} setData={setData} />}
            {tab === "bonus"    && <TabBonus    data={data} />}
            {tab === "members"  && <TabMembers  data={data} setData={setData} />}
            {tab === "backup"   && <TabBackup   data={data} setData={setData} />}
          </>
        )}
      </div>
    </div>
  );
}

function App() {
  // main = 一般帳本／priv = 私人帳本／locked = 鎖定後的空畫面（密碼閘蓋在上面）
  const [mode, setMode] = useState(
    typeof window !== "undefined" && window.__privMode === true ? "priv" : "main"
  );
  useEffect(() => {
    const onReady  = () => setMode("priv");
    const onLocked = () => setMode("locked");
    const onExit   = () => setMode("main");
    window.addEventListener("__priv_ready", onReady);
    window.addEventListener("__priv_locked", onLocked);
    window.addEventListener("__priv_exit", onExit);
    return () => {
      window.removeEventListener("__priv_ready", onReady);
      window.removeEventListener("__priv_locked", onLocked);
      window.removeEventListener("__priv_exit", onExit);
    };
  }, []);
  return (
    <DialogProvider>
      {mode === "priv"   ? <PrivateApp /> :
       mode === "locked" ? <div style={{ background: C.bg, minHeight: "100vh" }} /> :
                           <PokerApp />}
    </DialogProvider>
  );
}


document.getElementById("loading").style.display = "none";
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
